<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مسیر رهنگاشت — Rahnegasht Path</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#1CBECB; --navy:#1C1434; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#07061a; color:#EAF6F8; font-family:Vazirmatn, system-ui, sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .layer { position:fixed; inset:0; pointer-events:none; }
  #hud { z-index:21; }
  .hidden { display:none !important; }

  /* Loading / start */
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
           background:radial-gradient(1200px 700px at 30% 20%, rgba(28,190,203,.12), transparent 60%), #0b0922; pointer-events:auto; z-index:30;
           padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); transition:opacity .8s; }
  #start img.card { width:auto; height:auto; max-width:88vw; max-height:72vh; filter:drop-shadow(0 20px 60px rgba(0,0,0,.6)); }
  .btn { pointer-events:auto; cursor:pointer; font-family:inherit; font-weight:800; font-size:clamp(16px,2.4vh,22px); color:#0b0922; background:var(--cyan);
         border:none; border-radius:999px; padding:14px 46px; box-shadow:0 0 40px rgba(28,190,203,.5); transition:transform .15s, box-shadow .15s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 0 60px rgba(28,190,203,.75); }
  .btn[disabled] { opacity:.5; cursor:wait; }
  #loadbar { width:min(60vw,420px); height:4px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; }
  #loadbar > i { display:block; height:100%; width:0; background:var(--cyan); transition:width .2s; }

  /* HUD */
  #progress { position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); display:flex; gap:16px; direction:ltr; transition:opacity .6s; }
  #progress i { width:13px; height:13px; transform:rotate(45deg); border-radius:2px; background:rgba(255,255,255,.25); transition:all .4s; }
  #progress i.on { background:var(--cyan); box-shadow:0 0 14px var(--cyan), 0 0 4px #fff; }
  #card { position:fixed; right:calc(28px + env(safe-area-inset-right)); bottom:calc(28px + env(safe-area-inset-bottom)); width:min(42vw, 900px); height:auto;
          opacity:0; transform:translateY(24px); transition:opacity .45s, transform .45s; }
  #card.show { opacity:1; transform:none; }
  #card.summit { width:min(30vw, 640px); }
  #help { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(5,4,18,.55); pointer-events:auto; z-index:24; }
  #help img { max-width:84vw; max-height:84vh; }
  .prompt { position:fixed; left:50%; bottom:calc(46px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(34vw, 520px); min-width:260px; cursor:pointer; pointer-events:auto;
            animation:pulse 2.2s ease-in-out infinite; z-index:15; }
  @keyframes pulse { 0%,100% { opacity:.8 } 50% { opacity:1 } }
  .sitebtn { position:fixed; left:50%; bottom:calc(58px + max(260px, min(34vw, 520px)) * 0.149 + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:16; pointer-events:auto; text-decoration:none;
             display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 38px; border-radius:22px; color:#EAF6F8;
             background:linear-gradient(160deg, rgba(28,190,203,.28), rgba(20,14,44,.85)); border:1.5px solid rgba(28,190,203,.85);
             box-shadow:0 0 40px rgba(28,190,203,.45); backdrop-filter:blur(6px); transition:transform .15s; }
  .sitebtn:hover { transform:translateX(-50%) translateY(-2px); }
  .sitebtn .t { font-size:clamp(14px,2vh,18px); font-weight:600; opacity:.85; }
  .sitebtn .u { font-size:clamp(22px,3.6vh,34px); font-weight:900; direction:ltr; color:#BFF5FA; letter-spacing:.5px; }
  #skip { left:auto; right:calc(28px + env(safe-area-inset-right)); transform:none; width:min(24vw, 360px); min-width:200px; z-index:25; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:22; }
  #video { position:fixed; inset:0; width:100%; height:100%; background:#000; object-fit:contain; z-index:20; }
  #vidplay { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:26; }
  #topbtns { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:calc(14px + env(safe-area-inset-left)); display:flex; gap:10px; direction:ltr; z-index:14; }
  .icon { pointer-events:auto; cursor:pointer; width:40px; height:40px; border-radius:12px; border:1px solid rgba(28,190,203,.45); background:rgba(20,14,44,.55);
          color:#BFF5FA; font-size:18px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); }

  /* Touch controls */
  #touch { position:fixed; inset:0; z-index:10; }
  #joyzone { position:absolute; left:0; top:20%; bottom:0; width:50%; pointer-events:auto; touch-action:none; }
  #joybase, #joyknob { position:absolute; pointer-events:none; transform:translate(-50%,-50%); }
  #joybase { width:26vh; height:26vh; opacity:.55; }
  #joyknob { width:14vh; height:14vh; }
  .tbtn { position:absolute; pointer-events:auto; touch-action:none; border-radius:50%; opacity:.75; transition:transform .08s, opacity .08s; }
  .tbtn.down { opacity:1; transform:scale(1.08); }
  #tjump { width:20vh; height:20vh; right:calc(7vh + env(safe-area-inset-right)); bottom:12vh; }
  #tboost { width:17vh; height:17vh; right:calc(32vh + env(safe-area-inset-right)); bottom:5vh; }
  /* phones: project card top-right (clear of the touch buttons), progress at the bottom */
  @media (pointer: coarse) {
    #card { top:calc(66px + env(safe-area-inset-top)); bottom:auto; right:calc(12px + env(safe-area-inset-right)); width:min(44vw, 64vh); transform:translateY(-16px); }
    #card.summit { width:min(40vw, 58vh); }
    #progress { top:auto; bottom:calc(10px + env(safe-area-inset-bottom)); gap:10px; }
    #progress i { width:9px; height:9px; }
    .sitebtn { bottom:calc(24px + max(260px, min(34vw, 520px)) * 0.149 + env(safe-area-inset-bottom)); padding:6px 20px; }
    .sitebtn .u { font-size:20px; } .sitebtn .t { font-size:12px; }
    .prompt { bottom:calc(16px + env(safe-area-inset-bottom)); }
  }
  @media (max-aspect-ratio: 1/1) {
    #rotate { display:flex !important; }
  }
  #rotate { position:fixed; inset:0; z-index:40; background:#0b0922; display:none; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:30px; pointer-events:auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="layer">
  <div id="progress"></div>
  <img id="card" alt="">
  <a id="site" class="sitebtn hidden" href="https://rahnegasht.com" target="_blank" rel="noopener">
    <span class="t">ورود به وب‌سایت رهنگاشت</span><span class="u">rahnegasht.com ↗</span>
  </a>
  <img id="restart" class="prompt hidden" alt="تجربه یه مسیر تازه">
  <img id="skip" class="prompt hidden" alt="رد کردن ویدیو">
  <div id="topbtns">
    <div class="icon" id="btnFull" title="تمام‌صفحه">⛶</div>
    <div class="icon" id="btnHelp" title="راهنما">؟</div>
    <div class="icon" id="btnMute" title="صدا">♪</div>
  </div>
</div>

<div id="touch" class="layer hidden">
  <div id="joyzone"></div>
  <img id="joybase" src="assets/Touch_JoyBase.webp" alt="">
  <img id="joyknob" src="assets/Touch_JoyKnob.webp" alt="">
  <img id="tboost" class="tbtn" src="assets/Touch_Boost.webp" alt="شتاب">
  <img id="tjump" class="tbtn" src="assets/Touch_Jump.webp" alt="پرش">
</div>

<div id="help" class="hidden"><img id="helpimg" alt=""></div>
<video id="video" class="hidden" playsinline preload="none"></video>
<button id="vidplay" class="btn hidden">▶ پخش تریلر</button>
<div id="fade"></div>

<div id="start">
  <img class="card" id="startcard" alt="مسیر رهنگاشت">
  <div id="loadbar"><i></i></div>
  <button class="btn" id="startbtn" disabled>در حال بارگذاری…</button>
</div>
<div id="rotate">📱↻<br>برای تجربه‌ی بهتر، گوشی را افقی بگیرید</div>

<script src="game.js"></script>
</body>
</html>
